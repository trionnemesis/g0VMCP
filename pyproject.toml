[project]
name = "g0vmcp"
version = "0.1.0"
description = "政府採購標案情報聚合 MCP — 衛福部資訊服務類標案查詢"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "g0v contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27",
    # 上限 <1:selectolax 1.0 移除了 Modest backend,而 ingestion/fetcher.py
    # 與 scripts/enrich_open_date.py 都 import selectolax.parser(Modest)。
    # 無上限時 manifest 會解析到 1.0.x,import 當場 ImportError —— uv.lock 固定
    # 0.4.11,故 CI 綠燈但「從 manifest 全新安裝」是壞的,也與 pip-audit 實際
    # 稽核的版本樹不一致。此上限讓 manifest 與已稽核的 lockfile 對齊。
    # 後續應改用主動維護的 lexbor backend 以移除 2021 起即未更新的 Modest
    # (CWE-1104);該變更動到 HTML 解析核心流程,需人工核准,見 issue。
    "selectolax>=0.3,<1",
    "aiosqlite>=0.20",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
g0vmcp = "g0vmcp.mcp_server.__main__:main"
g0vmcp-sync = "g0vmcp.cli:sync_main"
g0vmcp-enrich = "g0vmcp.cli:enrich_main"
g0vmcp-purge = "g0vmcp.cli:purge_main"

[project.urls]
Repository = "https://github.com/g0v/g0vmcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g0vmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
