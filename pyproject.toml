[project]
name = "g0vmcp"
version = "0.1.0"
description = "政府採購標案情報聚合 MCP — 衛福部資訊服務類標案查詢"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "g0v contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27",
    "selectolax>=0.3",
    "aiosqlite>=0.20",
    "defusedxml>=0.7",
    # fastmcp 的遞移依賴,在此明確設下限。opentelemetry-api < 1.45.2 的
    # TraceContextTextMapPropagator.extract() 對 traceparent 有二次時間
    # 回溯(CVE-2026-126360 / GHSA-mf5v-w3w3-f6cg,ReDoS)。此路徑由
    # MCP 請求的 _meta.traceparent 直達(fastmcp/server/telemetry.py 的
    # _get_parent_trace_context),屬用戶端可控輸入,且 regex 為同步呼叫
    # 會阻塞事件迴圈。1.45.2 以 512 字元上限修正。
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
g0vmcp = "g0vmcp.mcp_server.__main__:main"
g0vmcp-sync = "g0vmcp.cli:sync_main"
g0vmcp-enrich = "g0vmcp.cli:enrich_main"
g0vmcp-purge = "g0vmcp.cli:purge_main"

[project.urls]
Repository = "https://github.com/g0v/g0vmcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g0vmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
